<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo Mã QR Tại Quầy</title>
  <!-- Sử dụng Tailwind CSS qua CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Thư viện tạo QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
    <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
      📱
    </div>
    <h1 class="text-2xl font-bold text-slate-800 mb-2">Mã QR Tiếp Nhận</h1>
    <p class="text-slate-500 mb-6 text-sm">Nhập địa chỉ IPv4 của máy tính (Network IP) do Vite cung cấp để tạo mã quét cho điện thoại.</p>

    <div class="mb-6 text-left">
      <label class="block text-slate-700 font-bold mb-2 text-sm">Địa chỉ IP Local (Ví dụ: 192.168.1.15)</label>
      <input type="text" id="ipInput" placeholder="Nhập IP..." 
        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all">
    </div>

    <button onclick="generateQR()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-md">
      Tạo Mã QR Ngay
    </button>

    <!-- Khu vực hiển thị QR Code -->
    <div id="qrContainer" class="mt-8 hidden flex-col items-center justify-center">
      <div id="qrcode" class="p-4 bg-white border-4 border-slate-200 rounded-xl inline-block shadow-sm"></div>
      
      <p class="mt-4 text-sm font-bold text-green-600 animate-pulse">Sẵn sàng! Hãy dùng điện thoại quét mã.</p>
      <a id="qrLink" href="#" target="_blank" class="mt-2 text-xs text-blue-500 underline break-all"></a>
    </div>

  </div>

  <script>
    let qrcodeObj = null;

    function generateQR() {
      const ip = document.getElementById('ipInput').value.trim();
      const qrContainer = document.getElementById('qrContainer');
      const qrDiv = document.getElementById('qrcode');
      const qrLink = document.getElementById('qrLink');

      if (!ip) {
        alert("Vui lòng nhập địa chỉ IP!");
        return;
      }

      // Xây dựng Link đến trang Intake Form của Frontend
      const url = `http://${ip}:5173/intake`;

      // Xóa QR cũ nếu có
      qrDiv.innerHTML = "";
      
      // Tạo QR Code mới
      qrcodeObj = new QRCode(qrDiv, {
        text: url,
        width: 200,
        height: 200,
        colorDark : "#0d457b", // Màu xanh của thương hiệu
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });

      // Hiển thị Link để kiểm tra trực tiếp trên máy tính
      qrLink.href = url;
      qrLink.innerText = url;

      // Hiển thị khu vực QR
      qrContainer.classList.remove('hidden');
      qrContainer.classList.add('flex');
    }
  </script>
</body>
</html>
